version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      firebase:
        patterns: ["firebase", "firebase-*", "@firebase/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
