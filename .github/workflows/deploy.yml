name: Verify, deploy and observe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salesdrone-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:metadata
      - run: npm run security:scan
      - run: npm run skills:check
      - run: npm run release:check
        if: github.event_name != 'workflow_dispatch'
      - run: npm test
      - run: npm run check
      - run: npm run api:docs
      - run: git diff --exit-code -- docs/openapi.json apps/web/public/openapi.json
      - run: npm run test:emulator
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run docs:build
      - run: npm run build
        env:
          VITE_USE_EMULATORS: 'false'
          VITE_ENABLE_RUM: 'false'
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://sales-drone-avinya.firebaseapp.com
    permissions:
      contents: write
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DYNATRACE_TENANT_URL: ${{ vars.DYNATRACE_TENANT_URL }}
      VITE_USE_EMULATORS: 'false'
      VITE_ENABLE_RUM: ${{ vars.VITE_ENABLE_RUM }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      VITE_FIREBASE_APPCHECK_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_KEY }}
      VITE_FIREBASE_APPCHECK_PROVIDER: ${{ vars.VITE_FIREBASE_APPCHECK_PROVIDER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate public browser configuration
        run: node -e "for(const k of ['GCP_PROJECT_ID','VITE_FIREBASE_VAPID_KEY','VITE_FIREBASE_APPCHECK_KEY'])if(!process.env[k])throw Error('Missing required repository variable '+k)"
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build exact release
        run: |
          npm run build
          node --input-type=module -e "import{writeFileSync}from'node:fs';writeFileSync('functions/.env.'+process.env.GCP_PROJECT_ID,'SDR_REGION=asia-south1\nAPP_CHECK_MODE=enforce\nGEMINI_MODEL=gemini-3.5-flash-lite\nDYNATRACE_TENANT_URL='+process.env.DYNATRACE_TENANT_URL+'\n')"
      - name: Deployment started
        run: echo 'DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
      - name: Deploy Firestore rules and indexes
        id: indexes
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only firestore --non-interactive
      - name: Wait for indexes
        run: node scripts/wait-indexes.mjs
      - name: Deploy Cloud Functions
        id: functions
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only functions:salesdrone --non-interactive
      - name: Deploy Firebase Hosting
        id: hosting
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only hosting --non-interactive
      - name: Check published version
        id: published
        run: node --input-type=module -e "const r=await fetch('https://sales-drone-avinya.firebaseapp.com/version.json',{cache:'no-store'});const v=await r.json();if(v.commit!==process.env.GITHUB_SHA)throw Error('Published commit mismatch');console.log('Published v'+v.version+' '+v.commit)"
      - name: Collect deployment metadata
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        run: node scripts/collect-deployment.mjs
      - name: Notify Dynatrace
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DEPLOYMENT_OUTCOME: ${{ steps.functions.outcome == 'success' && steps.hosting.outcome == 'success' && steps.published.outcome == 'success' && 'succeeded' || 'failed' }}
        run: node scripts/notify-deployment.mjs
      - name: Archive safe deployment details
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: salesdrone-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment.json
          retention-days: 30
      - name: Publish versioned GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
  documentation:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/.build
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
