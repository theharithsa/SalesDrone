name: Verify, deploy and observe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salesdrone-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Execute checks and retain per-test metadata
        run: node scripts/ci-checks.mjs
        env:
          VITE_USE_EMULATORS: 'false'
          VITE_ENABLE_RUM: 'false'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Archive safe verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salesdrone-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ci-checks.json
            test-results/cases-*.ndjson
          if-no-files-found: warn
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://sales-drone-avinya.firebaseapp.com
    permissions:
      contents: write
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DYNATRACE_TENANT_URL: ${{ vars.DYNATRACE_TENANT_URL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VITE_USE_EMULATORS: 'false'
      VITE_ENABLE_RUM: ${{ vars.VITE_ENABLE_RUM }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      VITE_FIREBASE_APPCHECK_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_KEY }}
      VITE_FIREBASE_APPCHECK_PROVIDER: ${{ vars.VITE_FIREBASE_APPCHECK_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate public browser configuration
        run: node -e "for(const k of ['GCP_PROJECT_ID','VITE_FIREBASE_VAPID_KEY','VITE_FIREBASE_APPCHECK_KEY'])if(!process.env[k])throw Error('Missing required repository variable '+k)"
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build exact release
        run: |
          npm run build
          node scripts/write-function-env.mjs
      - name: Deployment started
        run: echo 'DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
      - name: Deploy Firestore rules and indexes
        id: indexes
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only firestore --non-interactive
      - name: Wait for indexes
        id: wait_indexes
        run: node scripts/wait-indexes.mjs
      - name: Deploy private Storage rules
        id: storage
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only storage --non-interactive
      - name: Deploy Cloud Functions
        id: functions
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only functions:salesdrone --non-interactive
      - name: Deploy Firebase Hosting
        id: hosting
        run: npx --no-install firebase deploy --project "$GCP_PROJECT_ID" --only hosting --non-interactive
      - name: Check published version
        id: published
        run: node scripts/check-published.mjs
      - name: Collect deployment metadata
        env:
          STORAGE_DEPLOYMENT_OUTCOME: ${{ steps.storage.outcome }}
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        run: node scripts/collect-deployment.mjs
      - name: Verify deployed contract and protected boundaries
        id: postcheck
        if: success()
        run: npm run release:postcheck
      - name: Notify Dynatrace
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DEPLOY_FIRESTORE: ${{ steps.indexes.outcome }}
          DEPLOY_INDEXES: ${{ steps.wait_indexes.outcome }}
          DEPLOY_STORAGE: ${{ steps.storage.outcome }}
          DEPLOY_FUNCTIONS: ${{ steps.functions.outcome }}
          DEPLOY_HOSTING: ${{ steps.hosting.outcome }}
          DEPLOY_PUBLISHED: ${{ steps.published.outcome }}
          DEPLOY_POSTCHECK: ${{ steps.postcheck.outcome }}
        run: |
          DEPLOYMENT_OUTCOME="$(node scripts/deployment-outcome.mjs)" node scripts/notify-deployment.mjs
      - name: Archive safe deployment details
        if: always() && env.DEPLOY_ATTEMPTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salesdrone-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment.json
            release-verification.json
            monitoring.json
          retention-days: 30
      - name: Publish versioned GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
  documentation:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.build
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public settings documentation
        run: npm run release:postcheck -- --docs
      - name: Archive documentation verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salesdrone-docs-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs-verification.json
          retention-days: 30

  observe:
    # Never execute PR-controlled code with ingestion or deployment credentials.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, deploy, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download available verification evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: salesdrone-ci-${{ github.run_id }}-*
          path: test-results
          merge-multiple: true
      - name: Stamp reporting resource identity
        run: npm run build:metadata
      - name: Report workflow, checks and executed test cases
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_TENANT_URL: ${{ vars.DYNATRACE_TENANT_URL }}
          CI_VERIFY_RESULT: ${{ needs.verify.result }}
          CI_DEPLOY_RESULT: ${{ needs.deploy.result }}
          CI_DOCS_RESULT: ${{ needs.documentation.result }}
        run: node scripts/notify-ci.mjs
      - name: Archive CI signal receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salesdrone-ci-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-monitoring.json
          retention-days: 30
