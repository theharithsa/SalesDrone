name: Deploy pre-production
on:
  push:
    branches: [pre-prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salesdrone-pre-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/pre-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: pre-production
      url: https://sales-drone-avinya-preprod.web.app
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: sales-drone-avinya
      DYNATRACE_TENANT_URL: ${{ vars.DYNATRACE_TENANT_URL }}
      VITE_DEPLOYMENT_ENVIRONMENT: pre-production
      VITE_USE_EMULATORS: 'false'
      VITE_ENABLE_RUM: 'false'
      VITE_FIREBASE_APPCHECK_KEY: ${{ vars.PREPROD_APPCHECK_KEY }}
      VITE_FIREBASE_APPCHECK_PROVIDER: enterprise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build pre-production candidate
        run: |
          test -n "$VITE_FIREBASE_APPCHECK_KEY"
          npm run build
          node scripts/check-design-build.mjs
          printf 'PREPROD_TESTED_TREE=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          node scripts/preprod-config.mjs
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PREPROD_WIF_PROVIDER }}
          service_account: ${{ vars.PREPROD_DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy the isolated API and ingress
        run: |
          bash scripts/deploy-preprod-api.sh
          bash scripts/deploy-preprod-ingress.sh
      - name: Validate ingress before Hosting release
        run: |
          uri=$(gcloud run services describe salesdrone-preprod-ingress --region asia-south1 --format='value(status.url)')
          node --input-type=module -e 'import { checkIngressIdentity, checkIngress } from "./scripts/ingress-checks.mjs"; import { readFileSync } from "node:fs"; const release = JSON.parse(readFileSync("functions/src/release.json")); await checkIngressIdentity(process.argv[1], release); await checkIngress(process.argv[1], release, {largeBody: false});' "$uri"
      - name: Deploy only pre-production Hosting
        run: npx --no-install firebase deploy --project sales-drone-avinya --config .firebase-preprod.generated.json --only hosting --non-interactive
      - name: Verify published pre-production candidate
        run: node scripts/verify-preprod.mjs
      - name: Record pre-production evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preproduction-verification
          path: preproduction-verification.json
          if-no-files-found: error
          retention-days: 30
