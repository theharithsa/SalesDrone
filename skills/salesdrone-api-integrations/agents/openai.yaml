interface:
  display_name: "SalesDrone API platform and personal access tokens"
  short_description: "Maintain api platform and personal access tokens in SalesDrone"
  default_prompt: "Use $salesdrone-api-integrations for this module change. Only active Admin Google/App Check sessions manage their own tokens; display secrets once and store hashes only. Do not log or persist portal bearer credentials. Verify with `node --test functions/test/personal-access-tokens.test.js` and report remaining evidence limits."
