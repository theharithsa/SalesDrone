steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'services/ingress/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '--entrypoint', 'node', '${_IMAGE}', '--input-type=module', '-e', "await import('/app/functions/src/telemetry.js'); await import('/app/services/ingress/src/gateway.js'); console.log('Locked production modules loaded');"]
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
